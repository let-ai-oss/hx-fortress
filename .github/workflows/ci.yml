name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Blocking lint = style + security rules (eslint-plugin-security).
      # See eslint.config.js and the OSS Readiness Plan, Part 4.3.
      - name: Lint (incl. security rules)
        run: bun run lint

      - name: Test
        run: bun test

  # The PG-layer resilience design rests on empirically-pinned driver behavior
  # (Bun.SQL error shapes, SET LOCAL batch scoping, .simple() result layout).
  # This lane re-pins every one of those claims against a REAL Postgres so a
  # Bun/driver upgrade fails HERE instead of shipping a silent prod no-op. It
  # connects directly to the service container via FORTRESS_PG_CI_DSN — NOT the
  # embedded provider (the FORTRESS_PG_E2E lane is bit-rotted: its fixtures
  # point pgvector acquisition at a fake cloud URL; repairing it is a separate
  # effort).
  pg-resilience:
    name: PG resilience pins (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches the embedded default major (18) and carries pgvector.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: hx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Real-Postgres pins
        env:
          FORTRESS_PG_CI_DSN: postgresql://postgres:hx@127.0.0.1:5432/postgres
        run: bun test test/e2e/pg-resilience-ci.e2e.test.ts

      # The DB-backed suites gate on FORTRESS_DATABASE_URL, and the plain
      # `bun test` job above sets no DSN — so until now every one of them SKIPPED
      # in CI. That included the guarantor's repair/verification tests and the
      # FK-index invariant, whose own header calls itself "the only thing
      # standing between the next FK and a repeat". It never ran.
      #
      # One database PER FILE: these suites share the `hx` tables, so running
      # them together against a single database makes them collide and fail for
      # reasons that have nothing to do with the code.
      - name: DB-backed suites (one database per file)
        env:
          PGPASSWORD: hx
        run: |
          set -euo pipefail
          for f in $(grep -rl "FORTRESS_DATABASE_URL" test --include='*.test.ts' | sort); do
            db="ci_$(basename "$f" .test.ts | tr -c 'a-zA-Z0-9' '_')"
            psql -h 127.0.0.1 -U postgres -q -c "DROP DATABASE IF EXISTS $db" -c "CREATE DATABASE $db"
            echo "--- $f -> $db"
            FORTRESS_DATABASE_URL="postgresql://postgres:hx@127.0.0.1:5432/$db" bun test "$f"
          done
