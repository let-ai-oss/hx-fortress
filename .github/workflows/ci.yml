name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A broken console build must fail the PR, not the release. The rebuild
      # comparison proves the embedded assets are the ones this commit's sources
      # produce — a stale ui/dist lying in a tree can never ride along.
      - name: Build the console and verify an independent rebuild
        run: |
          set -euo pipefail
          bun run build:ui
          first="$(bun scripts/gen-ui-assets.ts --print-hash)"
          rm -rf ui/dist
          bun run build:ui
          second="$(bun scripts/gen-ui-assets.ts --print-hash)"
          if [[ "$first" != "$second" ]]; then
            echo "console assets are not reproducible: $first != $second" >&2
            exit 1
          fi
          echo "console assets sha256 $first"
          bun run gen:ui

      - name: Typecheck
        run: bun run typecheck

      # Blocking lint = style + security rules (eslint-plugin-security).
      # See eslint.config.js and the OSS Readiness Plan, Part 4.3.
      - name: Lint (incl. security rules)
        run: bun run lint

      - name: Test
        run: bun test

  # The store backends are the code most likely to be wrong in a way a mock
  # cannot see — signed URLs, compose, versioned deletes and listing are provider
  # behaviour, not ours. This job proves the PINNED emulator images still start
  # and answer; without it the rig rots silently, because every emulator-backed
  # suite is skip-with-reason and a skip is not a failure.
  storage-emulators:
    name: Storage emulators (MinIO + fake-gcs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pinned by digest inside the rig, not by a tag written here — one place
      # decides which image a laptop and this job both run.
      - name: Start the emulators
        run: bun run rig:emulators:up

      - name: Rig suite
        run: bun test test/rig.test.ts

      - name: Stop the emulators
        if: always()
        run: bun run rig:emulators:down

  # The privilege-matrix and one-way-machine acceptances need a real Postgres:
  # has_table_privilege / has_column_privilege / has_function_privilege only
  # mean anything against a live catalog. They run in their OWN job so the
  # service container costs nothing on the fast lane, and the CI marker turns a
  # missing service into a FAILURE — a matrix acceptance that silently skips is
  # a matrix acceptance that never ran.
  privilege-matrix:
    name: Privilege matrix (embedded + external DSN)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: fortress-ci
          POSTGRES_DB: hx-db
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A superuser bootstrap DSN — the same authority buildPostgresProvider
      # runs migrations and ensureAppRoles under in embedded mode.
      FORTRESS_MATRIX_DATABASE_URL: postgresql://postgres:fortress-ci@127.0.0.1:55432/hx-db
      FORTRESS_PG_MATRIX_REQUIRED: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Embedded semantics: role split, the SECURITY DEFINER apparatus, and the
      # per-table matrix asserted on the SECOND boot (the blanket GRANT every
      # boot re-issues must not undo a REVOKE).
      - name: Embedded-mode privilege matrix
        run: bun test test/e2e/console-plane.e2e.test.ts

      # External Postgres carries its OWN honest assertion set: containment is
      # void there by construction (the operator's role owns the tables), so the
      # job asserts that 0015 applies, that console reads work, that mutations
      # succeed through direct DML, and that the probe reports UNAVAILABLE.
      - name: External-DSN job
        run: bun test test/e2e/console-external-dsn.e2e.test.ts
