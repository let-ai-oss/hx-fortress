# gitleaks configuration for hx-fortress
#
# Extends the built-in ruleset (all default detectors stay active) and adds
# narrow, path-scoped allowlists for the intentionally secret-shaped TEST
# FIXTURES that some suites cannot do without: the crafted strings proving the
# embedding scrubber redacts secrets, and the 32-hex credentialRef ids proving a
# rotation carries a reference and never the credential. Neither is a live
# credential. Every other file is fully scanned.

title = "hx-fortress gitleaks config"

[extend]
# Pull in the maintained default rules so we only ADD an allowlist, never
# weaken detection.
useDefault = true

[[allowlists]]
description = "Redacted secret-scrub test fixtures (test/embed-scrub.test.ts) — not live secrets"
# Any secret found inside this test file, in any commit, is a fixture. Scoping
# by path (not a blanket regex) keeps every other file fully scanned.
paths = [
  '''test/embed-scrub\.test\.ts''',
]

[[allowlists]]
description = "The two canonical placeholders the console tests use as credential REFERENCE ids (they assert the reference is NOT the credential) — self-evidently synthetic. Scoped to the exact secret VALUES, so the files stay fully scanned for anything real."
regexTarget = "secret"
regexes = [
  '''^0123456789abcdef0123456789abcdef$''',
  '''^fedcba9876543210fedcba9876543210$''',
]
